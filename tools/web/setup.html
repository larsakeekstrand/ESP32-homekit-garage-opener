<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garage setup</title><style>:root{--bg:#0d0e12;--ink:#eceef3;--mut:#868c9b;--amber:#f5a524;--line:rgba(255,255,255,.09);--sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}*{box-sizing:border-box}html,body{margin:0}body{font-family:var(--sans);color:var(--ink);background:var(--bg);min-height:100vh;display:grid;place-items:center;padding:24px;background-image:radial-gradient(120% 80% at 50% -10%,rgba(245,165,36,.12),transparent 60%)}.box{width:100%;max-width:400px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:20px;padding:28px}.tag{font-family:var(--mono);letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--amber);margin-bottom:14px}h1{font-size:22px;margin:0 0 10px}p{color:var(--mut);font-size:13px;line-height:1.55;margin:0 0 18px}input{width:100%;background:#15171d;border:1px solid var(--line);color:var(--ink);font-size:15px;padding:12px 14px;border-radius:12px;outline:none}input:focus{border-color:var(--amber)}button{width:100%;margin-top:12px;border:0;border-radius:12px;padding:12px;background:var(--amber);color:#241a06;font-weight:600;font-size:15px;cursor:pointer}</style></head><body><div class="box"><div class="tag">Garage Opener · Setup</div><h1>Set a password</h1><p>This device has no password yet. Choose one (min 4 characters). Do it promptly — anyone on this network can set it until you do.</p><input id="pw" type="password" placeholder="New password" autofocus><button onclick="fetch('/api/password',{method:'POST',body:'password='+encodeURIComponent(pw.value)}).then(r=>r.ok?location.reload():r.text().then(t=>alert(t)))">Save password</button></div></body></html>
